<svg viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Run-of-river scheme illustration</title>
  <desc id="d">Conceptual illustration of a run-of-river hydropower scheme from intake to powerhouse and grid.</desc>
  <rect width="800" height="600" fill="#F5F9FA"/>
  <rect x="30" y="30" width="740" height="540" rx="26" fill="#ffffff" stroke="#D3E6F0"/>
  <rect x="0" y="410" width="800" height="190" fill="#EAF4F9"/>
  <text x="60" y="80" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700" fill="#102A36">Run-of-River Scheme (Concept)</text>
  <text x="60" y="104" font-family="ui-sans-serif, system-ui" font-size="13" fill="#60727A">River → Intake → Headrace → Penstock → Powerhouse → Tailrace → Grid</text>

  <defs>
    <linearGradient id="rw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stopColor="#77C99C"/><stop offset="1" stopColor="#159447"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stopColor="#599FC6"/><stop offset="1" stopColor="#135F88"/>
    </linearGradient>
  </defs>

  <path d="M60 340 C 120 300 140 360 200 330 C 260 300 290 352 340 322" stroke="url(#rw)" strokeWidth="14" strokeLinecap="round"/>
  <path d="M340 322 L340 250" stroke="#0B4F71" strokeWidth="18" strokeLinecap="round"/>
  <path d="M340 250 C 400 250 400 180 470 180" stroke="#0B4F71" strokeWidth="18" strokeLinecap="round"/>
  <path d="M470 180 L470 300" stroke="#0B4F71" strokeWidth="18" strokeLinecap="round"/>
  <rect x="428" y="300" width="92" height="58" rx="10" fill="#0B4F71"/>
  <text x="474" y="336" font-family="ui-sans-serif, system-ui" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Powerhouse</text>
  <path d="M470 358 C 470 400 430 410 460 440" stroke="url(#rw)" strokeWidth="12" strokeLinecap="round"/>
  <text x="120" y="330" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="600" fill="#0B4F71" text-anchor="middle">Intake</text>
  <text x="330" y="230" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="600" fill="#0B4F71" text-anchor="middle">Penstock</text>
  <line x1="523" y1="318" x2="600" y2="318" stroke="#3F8CB5" strokeWidth="8"/>
  <line x1="600" y1="318" x2="630" y2="318" stroke="url(#d)" strokeWidth="8"/>
  <circle cx="650" cy="318" r="7" fill="#159447"/>
  <text x="640" y="350" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="600" fill="#0B4F71">33 kV Grid</text>
  <text x="120" y="500" font-family="ui-sans-serif, system-ui" font-size="11" fill="#60727A">Water is returned to the river after generation.</text>
</svg>